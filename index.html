<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Manrope:wght@400;600&display=swap">
<style>
:root{--ink:#1d1330;--ink2:#2e2150;--rose:#ff8aa8;--lilac:#cdbcff;--gold:#ffd98a;--text:#f6eefc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--ink2),var(--ink) 70%) var(--ink);color:var(--text);
font:400 17px/1.6 Manrope,system-ui,sans-serif;text-align:center}
section{max-width:640px;margin:0 auto;padding:56px 20px}
h1,h2{font-family:Caveat,cursive;font-weight:600;margin:0 0 12px;line-height:1.1}
h1{font-size:clamp(44px,11vw,72px);color:var(--rose)}
.nm{white-space:nowrap}
.cat{width:.85em;height:.85em;vertical-align:-.08em;margin-left:.15em}
.since{margin:14px 0 0;font-size:15px;color:var(--lilac)}
h2{font-size:clamp(34px,8vw,44px);color:var(--gold)}
.lead{color:var(--lilac);margin:0 0 28px}
/* таймер */
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.timer div{background:rgba(255,255,255,.06);border-radius:14px;padding:16px 4px}
.timer b{display:block;font-size:clamp(28px,8vw,40px);font-variant-numeric:tabular-nums;color:var(--rose)}
.timer span{font-size:13px;color:var(--lilac)}
/* квиз */
.opts{display:grid;gap:10px;margin-top:16px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{background:rgba(255,255,255,.07);border:1px solid rgba(205,188,255,.35);border-radius:12px;padding:12px 16px}
.opt:hover:not(:disabled){border-color:var(--rose)}
.opt.ok{background:rgba(120,220,160,.25);border-color:#7fdca4}
.opt.no{background:rgba(255,120,120,.2);border-color:#ff8a8a}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.next{margin-top:18px;background:var(--rose);color:var(--ink);border:0;border-radius:999px;padding:11px 26px;font-weight:600}
/* звёзды */
.sky{position:relative;height:300px;margin:8px 0 20px;border-radius:20px;background:rgba(255,255,255,.04)}
.star{position:absolute;width:44px;height:44px;margin:-22px;border:0;background:none;font-size:30px;color:var(--lilac);transition:transform .25s,color .25s,text-shadow .25s}
.star:hover{transform:scale(1.2)}
.star.on{color:var(--gold);text-shadow:0 0 16px var(--gold)}
.reason{min-height:3.4em;font-size:19px}
.finale{opacity:0;transition:opacity 1.2s;margin-top:20px}
.finale.show{opacity:1}
.finale p{font-family:Caveat,cursive;font-size:clamp(40px,10vw,60px);color:var(--rose);margin:0;line-height:1.15}
.heart{position:fixed;bottom:-30px;pointer-events:none;animation:up 4s ease-in forwards}
@keyframes up{to{transform:translateY(-110vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart{display:none}.star,.finale{transition:none}}
</style>
</head>
<body>

<section>
  <h1>Для тебя, <span class="nm"><span id="name"></span><svg class="cat" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 28 L10 4 L26 14 Z" fill="#fff"/><path d="M56 28 L54 4 L38 14 Z" fill="#fff"/><path d="M12 22 L13 10 L21 15 Z" fill="#ffb3c6"/><path d="M52 22 L51 10 L43 15 Z" fill="#ffb3c6"/><ellipse cx="32" cy="36" rx="26" ry="22" fill="#fff"/><circle cx="22" cy="34" r="3" fill="#2a1a3a"/><circle cx="42" cy="34" r="3" fill="#2a1a3a"/><path d="M29 41 h6 l-3 4 z" fill="#ff8aa8"/><path d="M32 45 q-4 5 -8 2 M32 45 q4 5 8 2" stroke="#2a1a3a" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M10 38 h9 M10 44 l9 -2 M54 38 h-9 M54 44 l-9 -2" stroke="#b9a8e6" stroke-width="1.4" stroke-linecap="round"/></svg></span></h1>
  <p class="lead">Мы вместе уже</p>
  <div class="timer" id="timer"></div>
  <p class="since" id="since"></p>
</section>

<section>
  <h2>Как хорошо ты меня знаешь?</h2>
  <p class="lead" id="qcount"></p>
  <div id="quiz"></div>
</section>

<section>
  <h2>Нажми на звёзды</h2>
  <p class="lead">Пять причин, почему я тебя люблю</p>
  <div class="sky" id="sky"></div>
  <p class="reason" id="reason" aria-live="polite"></p>
  <div class="finale" id="finale"><p></p></div>
</section>

<script>
/* ===== ДАННЫЕ: меняй только этот блок (логика ниже его не трогает) ===== */
const CONFIG = {
  name: "котик",                    // как ты её называешь (рядом рисуется белый котик)
  since: "2025-11-01T00:00:00",       // от этой даты считает таймер
  reasons: [                          // причины, по одной на звезду
    "Ты моя причина вставать каждый день.",
    "С тобой я чувствую себя дома.",
    "Без тебя моя жизнь как без солнца земля.",
    "Ты всегда сумеешь меня развеселить.",
    "Моё сердце не бьётся без тебя."
  ],
  quiz: [                             // a = список индексов верных ответов (с нуля)
    {q: "Когда мы начали встречаться?", o: ["01.10", "01.11", "01.12"], a: [1]},
    {q: "Когда у меня день рождения?", o: ["12.03", "05.07", "21.10"], a: [2]},
    {q: "Кто сильнее любит?", o: ["Я", "Я", "Я"], a: [0, 1, 2]}
  ],
  finale: "Я очень тебя люблю."
};
/* ===== ЛОГИКА ===== */

// 1. Заголовок и таймер: разница дат в мс, разложенная на дни/часы/минуты/секунды
document.getElementById("name").textContent = CONFIG.name;
document.getElementById("since").textContent = "с " + new Date(CONFIG.since).toLocaleDateString("ru-RU", {day: "numeric", month: "long"});
const timerEl = document.getElementById("timer");
const since = new Date(CONFIG.since).getTime();
function tick() {
  const diff = Math.max(0, Date.now() - since);
  const parts = [
    [Math.floor(diff / 864e5), "дней"],
    [Math.floor(diff / 36e5) % 24, "часов"],
    [Math.floor(diff / 6e4) % 60, "минут"],
    [Math.floor(diff / 1e3) % 60, "секунд"]
  ];
  timerEl.innerHTML = "";
  for (const [n, label] of parts) {
    const d = document.createElement("div");
    d.innerHTML = "<b>" + n + "</b><span>" + label + "</span>";
    timerEl.append(d);
  }
}
tick();
setInterval(tick, 1000);

// 2. Квиз: состояние = индекс вопроса + счётчик верных
const quizEl = document.getElementById("quiz");
const qcount = document.getElementById("qcount");
let qi = 0, score = 0;
function showQuestion() {
  const item = CONFIG.quiz[qi];
  qcount.textContent = "Вопрос " + (qi + 1) + " из " + CONFIG.quiz.length;
  quizEl.innerHTML = "";
  const q = document.createElement("p");
  q.textContent = item.q;
  const box = document.createElement("div");
  box.className = "opts";
  item.o.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = text;
    b.onclick = () => answer(i, box);
    box.append(b);
  });
  quizEl.append(q, box);
}
function answer(i, box) {
  const item = CONFIG.quiz[qi];
  if (item.a.includes(i)) score++;
  [...box.children].forEach((b, j) => {
    b.disabled = true;
    if (item.a.includes(j)) b.classList.add("ok");
    else if (j === i) b.classList.add("no");
  });
  const next = document.createElement("button");
  next.className = "next";
  next.textContent = qi + 1 < CONFIG.quiz.length ? "Дальше" : "Узнать результат";
  next.onclick = () => { qi++; qi < CONFIG.quiz.length ? showQuestion() : showResult(); };
  quizEl.append(next);
}
function showResult() {
  qcount.textContent = "";
  quizEl.innerHTML = "<p>Верных ответов: " + score + " из " + CONFIG.quiz.length +
    ". Что бы ни вышло, ты всё равно лучшая.</p>";
}
showQuestion();

// 3. Звёзды: позиции в %, Set хранит уже открытые; когда открыты все — финал
const spots = [[15, 25], [75, 18], [45, 50], [20, 78], [82, 70]];
const sky = document.getElementById("sky");
const reasonEl = document.getElementById("reason");
const finale = document.getElementById("finale");
const opened = new Set();
CONFIG.reasons.forEach((text, i) => {
  const s = document.createElement("button");
  s.className = "star";
  s.textContent = "★";
  s.setAttribute("aria-label", "Причина " + (i + 1));
  s.style.left = spots[i % spots.length][0] + "%";
  s.style.top = spots[i % spots.length][1] + "%";
  s.onclick = () => {
    s.classList.add("on");
    reasonEl.textContent = text;
    opened.add(i);
    if (opened.size === CONFIG.reasons.length) celebrate();
  };
  sky.append(s);
});
function celebrate() {
  finale.firstElementChild.textContent = CONFIG.finale;
  finale.classList.add("show");
  for (let k = 0; k < 18; k++) {
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = "♥";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 18 + Math.random() * 26 + "px";
    h.style.color = Math.random() > .5 ? "#ff8aa8" : "#ffd98a";
    h.style.animationDelay = Math.random() * 1.5 + "s";
    document.body.append(h);
    setTimeout(() => h.remove(), 6000);
  }
}
</script>
</body>
</html>
